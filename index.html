<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Mesin Cloud</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- HTML5 QR Code Scanner & Tesseract.js untuk OCR Teks/Angka -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Firebase SDK (Version 10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Asli Anda
    const firebaseConfig = {
      apiKey: "AIzaSyD8W_cABvEnNBtmAFIZPCHE2g9kyxrRi0s",
      authDomain: "mesin-cloud-app.firebaseapp.com",
      projectId: "mesin-cloud-app",
      storageBucket: "mesin-cloud-app.firebasestorage.app",
      messagingSenderId: "20271105778",
      appId: "1:20271105778:web:c253cf35236581a571726b",
      measurementId: "G-TML7FFBP0V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listMesin = [];

    // Fungsi Kompresi Foto ke Base64 Teks (Client-side)
    function kompresiFoto(file, maxWidth, maxHeight, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round(height *= maxWidth / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round(width *= maxHeight / height);
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    // Format Tanggal Detail (Hari, Tgl, Jam)
    function formatTanggalDetail(isoString) {
      if(!isoString) return "-";
      const date = new Date(isoString);
      const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][date.getDay()];
      const tgl = date.getDate().toString().padStart(2, '0');
      const bln = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][date.getMonth()];
      const jam = date.getHours().toString().padStart(2, '0');
      const mnt = date.getMinutes().toString().padStart(2, '0');
      return `${hari}, ${tgl} ${bln} - ${jam}:${mnt} WIB`;
    }

    // Memuat Data dari Firestore
    async function muatData() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat data dari Cloud...</div>`;
      
      try {
        const q = query(collection(db, "mesin"), orderBy("waktuInput", "desc"));
        const querySnapshot = await getDocs(q);
        
        listMesin = [];
        querySnapshot.forEach((d) => {
          listMesin.push({ id: d.id, ...d.data() });
        });
        
        renderKPI(listMesin);
        renderLog(listMesin);
        renderCards(listMesin);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="text-center py-10 text-red-500 text-sm">Gagal memuat data. Pastikan koneksi dan aturan database terbuka.</div>`;
      }
    }

    // Render KPI Card
    function renderKPI(data) {
      document.getElementById('kpiTotalItem').innerText = data.length;
      const totalUnit = data.reduce((sum, item) => sum + (Number(item.jumlah) || 0), 0);
      document.getElementById('kpiTotalUnit').innerText = totalUnit;
    }

    // Render 3 Riwayat Log Terakhir
    function renderLog(data) {
      const container = document.getElementById('logContainer');
      const latest3 = data.slice(0, 3);
      
      if(latest3.length === 0) {
         container.innerHTML = `<div class="text-[10px] text-slate-400 mt-2 text-center">Belum ada riwayat input</div>`;
         return;
      }

      container.innerHTML = latest3.map(m => `
        <div class="flex flex-col border-l-2 border-emerald-400 pl-2 mb-1.5 last:mb-0">
          <span class="text-[10px] font-bold text-slate-700 truncate">${m.namaMesin}</span>
          <span class="text-[9px] text-slate-500">${formatTanggalDetail(m.waktuInput)}</span>
        </div>
      `).join('');
    }

    // Fitur Hapus Data dari Firestore
    async function hapusDataMesin(id, nama) {
      if (confirm(`Apakah Anda yakin ingin menghapus data mesin "${nama}"?`)) {
        try {
          await deleteDoc(doc(db, "mesin", id));
          muatData();
        } catch (err) {
          alert("Gagal menghapus data: " + err.message);
        }
      }
    }

    // Render Tampilan Explorer
    function renderCards(data) {
      const container = document.getElementById('cardsContainer');
      const currentView = document.getElementById('viewMode').value;

      if (data.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">Belum ada data mesin di database.</div>`;
        return;
      }

      const getImageHTML = (fotoUrl, kelas) => {
        return (fotoUrl && fotoUrl.length > 50) 
          ? `<img src="${fotoUrl}" class="${kelas}">` 
          : `<div class="${kelas} bg-slate-100 flex items-center justify-center text-slate-400 text-xs"><i class="fa-solid fa-image"></i></div>`;
      };

      if (currentView === 'card') {
        container.className = "space-y-4";
        container.innerHTML = data.map(m => `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3 relative group">
            <button onclick="hapusDataMesin('${m.id}', '${m.namaMesin}')" class="absolute top-6 right-6 bg-red-500/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs shadow-md transition z-10" title="Hapus Data">
              <i class="fa-solid fa-trash-can"></i>
            </button>
            ${getImageHTML(m.fotoUrl, 'w-full h-48 object-cover rounded-xl border')}
            <div>
              <div class="flex justify-between items-start pr-10">
                <h4 class="font-bold text-slate-800 text-base">${m.namaMesin}</h4>
              </div>
              <div class="flex items-center gap-2 mt-1">
                <span class="bg-blue-50 text-blue-600 border border-blue-100 text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wide">${m.tipeMesin || '-'}</span>
                <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${m.plant}</p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-[11px] bg-slate-50 p-2.5 rounded-xl text-slate-600 border border-slate-100">
              <div><span class="text-slate-400 block">No Seri:</span> <strong>${m.noSeri}</strong></div>
              <div><span class="text-slate-400 block">Tahun:</span> <strong>${m.tahun}</strong></div>
              <div><span class="text-slate-400 block">Jumlah:</span> <strong class="text-emerald-600">${m.jumlah} Unit</strong></div>
            </div>
          </div>
        `).join('');
      } else if (currentView === 'details') {
        container.className = "space-y-2";
        container.innerHTML = data.map(m => `
          <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 overflow-hidden">
              ${getImageHTML(m.fotoUrl, 'w-12 h-12 object-cover rounded-lg border flex-shrink-0')}
              <div class="truncate">
                <h4 class="font-bold text-slate-800 text-sm truncate">${m.namaMesin}</h4>
                <p class="text-[10px] text-slate-500">${m.plant} • <span class="text-blue-500 font-semibold">${m.tipeMesin || '-'}</span></p>
              </div>
            </div>
            <div class="flex items-center gap-3 flex-shrink-0">
              <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">${m.jumlah} Unit</span>
              <button onclick="hapusDataMesin('${m.id}', '${m.namaMesin}')" class="text-slate-400 hover:text-red-500 p-1.5 transition" title="Hapus Data">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `).join('');
      } else if (currentView === 'large') {
        container.className = "grid grid-cols-2 gap-3";
        container.innerHTML = data.map(m => `
          <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col justify-between relative">
            <button onclick="hapusDataMesin('${m.id}', '${m.namaMesin}')" class="absolute top-4 right-4 bg-red-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-[10px] shadow-md transition z-10" title="Hapus Data">
              <i class="fa-solid fa-trash-can"></i>
            </button>
            ${getImageHTML(m.fotoUrl, 'w-full h-28 object-cover rounded-lg border mb-2')}
            <div>
              <h4 class="font-bold text-slate-800 text-xs truncate">${m.namaMesin}</h4>
              <p class="text-[9px] text-blue-500 font-bold mb-1 truncate">${m.tipeMesin || '-'}</p>
              <div class="mt-1 text-[10px] text-slate-600 bg-slate-50 p-1.5 rounded-lg flex justify-between">
                <span class="truncate pr-1">${m.noSeri}</span>
                <strong class="text-emerald-600 flex-shrink-0">${m.jumlah} U</strong>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    // Submit Form
    document.getElementById('formMesin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Menyimpan...`;
      btn.disabled = true;

      try {
        let fotoDataFinal = '';
        const fotoFile = document.getElementById('fotoInput').files[0];

        if (fotoFile) {
          fotoDataFinal = await kompresiFoto(fotoFile, 800, 800, 0.7);
        }

        await addDoc(collection(db, "mesin"), {
          namaMesin: document.getElementById('namaMesin').value,
          tipeMesin: document.getElementById('tipeMesin').value,
          plant: document.getElementById('plant').value,
          tahun: Number(document.getElementById('tahun').value),
          noSeri: document.getElementById('noSeri').value,
          jumlah: Number(document.getElementById('jumlah').value),
          fotoUrl: fotoDataFinal, 
          waktuInput: new Date().toISOString()
        });

        btn.innerText = "Simpan Data";
        btn.disabled = false;
        
        window.tutupModal();
        document.getElementById('formMesin').reset();
        document.getElementById('imgPreview').classList.add('hidden');
        muatData();
      } catch (err) {
        alert("Terjadi kesalahan: " + err.message);
        btn.innerText = "Simpan Data";
        btn.disabled = false;
      }
    });

    window.muatData = muatData;
    window.renderCards = renderCards;
    window.hapusDataMesin = hapusDataMesin;
    window.getListMesin = () => listMesin;
    
    muatData();
  </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-40 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg tracking-wide"><i class="fa-solid fa-industry text-emerald-400 mr-2"></i>DataBase Mesin Assembly</h1>
      <p class="text-xs text-slate-400">Dashboard & Cloud System</p>
    </div>
    <button onclick="bukaModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1">
      <i class="fa-solid fa-plus"></i> Tambah
    </button>
  </header>

  <main class="max-w-md mx-auto p-4">
    
    <!-- DASHBOARD KPI & LOG -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl p-4 text-white shadow-sm flex flex-col justify-center">
        <span class="text-[10px] font-semibold opacity-90 tracking-wide uppercase">Total Aset</span>
        <div class="flex items-end gap-1 mt-1">
          <span id="kpiTotalItem" class="text-3xl font-bold">0</span>
          <span class="text-[10px] mb-1.5 opacity-80">Mesin Terdata</span>
        </div>
        <div class="text-[10px] bg-black/20 px-2 py-1 rounded mt-2 inline-block w-fit font-medium">
          <i class="fa-solid fa-cubes mr-1"></i><span id="kpiTotalUnit">0</span> Unit Aktual
        </div>
      </div>
      
      <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm flex flex-col">
        <span class="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wide border-b pb-1"><i class="fa-solid fa-clock-rotate-left mr-1"></i>Riwayat Terakhir</span>
        <div id="logContainer" class="flex-1 flex flex-col justify-center gap-1"></div>
      </div>
    </div>

    <!-- Toolbar Explorer -->
    <div class="flex gap-2 mb-4">
      <div class="relative flex-1">
        <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari tipe, nama, atau seri..." class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
      </div>
      <select id="viewMode" onchange="filterData()" class="bg-white border border-slate-200 text-xs font-semibold rounded-xl px-2.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700">
        <option value="card"> Kartu</option>
        <option value="details"> Details (List)</option>
        <option value="large"> Large Icons</option>
      </select>
    </div>

    <div id="cardsContainer" class="space-y-4"></div>
  </main>

  <!-- Modal Form Input -->
  <div id="modalForm" class="fixed inset-0 bg-slate-900/60 z-50 hidden backdrop-blur-sm overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-center justify-center">
      <div class="bg-white rounded-2xl max-w-md w-full p-5 text-left shadow-2xl relative my-8">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h3 class="font-bold text-slate-800 text-sm">Input Mesin Baru</h3>
          <button onclick="tutupModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <form id="formMesin" class="space-y-3 text-xs">
          <div>
            <label class="font-semibold text-slate-700 block mb-1">Nama Mesin</label>
            <input type="text" id="namaMesin" required class="w-full p-2.5 rounded-lg border text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1">Tipe Mesin</label>
            <input type="text" id="tipeMesin" required placeholder="Contoh: Press, Puncher, Vacum, Blow, Hotmelt, Ultrasonic, UV Curing..." class="w-full p-2.5 rounded-lg border text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-semibold text-slate-700 block mb-1">Plant / Lokasi</label>
              <select id="plant" required class="w-full p-2.5 rounded-lg border text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                <option value="Assembly Plant Alpha">Assembly Plant Alpha</option>
                <option value="Assembly Plant Beta">Assembly Plant Beta</option>
                <option value="Plant 3">Plant 3</option>
              </select>
            </div>
            <div>
              <label class="font-semibold text-slate-700 block mb-1">Tahun Mesin</label>
              <input type="number" id="tahun" required class="w-full p-2.5 rounded-lg border text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="2024">
            </div>
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1">Nomor Seri</label>
            <div class="flex gap-2">
              <input type="text" id="noSeri" required placeholder="Ketik manual atau scan teks foto" class="w-full p-2.5 rounded-lg border text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <!-- Tombol Scanner QR / Barcode / Foto Teks -->
              <button type="button" onclick="bukaOpsiScan()" class="bg-slate-800 text-white px-3 rounded-lg hover:bg-slate-700 flex items-center justify-center" title="Scan Barcode atau Foto Teks">
                <i class="fa-solid fa-camera text-base"></i>
              </button>
            </div>
            
            <!-- Area Kamera QR / Barcode -->
            <div id="reader" class="hidden mt-2 rounded-lg overflow-hidden border"></div>

            <!-- Tombol Pilih Foto Plat Nomor untuk dibaca teks/angkanya (OCR) -->
            <div id="ocrContainer" class="hidden mt-2 p-2 bg-slate-50 border rounded-lg text-center">
              <p class="text-[10px] text-slate-500 mb-1">Atau ambil foto plat nomor/teks langsung:</p>
              <input type="file" id="ocrInput" accept="image/*" capture="environment" onchange="prosesScanTeks(event)" class="text-[10px]">
              <div id="ocrStatus" class="text-[10px] text-emerald-600 font-semibold mt-1"></div>
            </div>
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1">Jumlah (Unit)</label>
            <input type="number" id="jumlah" value="1" required class="w-full p-2.5 rounded-lg border text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1">Foto Mesin (Opsional)</label>
            <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="previewFoto(event)" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
            <img id="imgPreview" class="hidden mt-2 w-full h-36 object-cover rounded-lg border">
          </div>

          <div class="pt-3 flex gap-2">
            <button type="button" onclick="tutupModal()" class="w-1/2 py-2.5 rounded-xl border font-semibold text-slate-600 hover:bg-slate-50">Batal</button>
            <button type="submit" id="btnSimpan" class="w-1/2 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold hover:bg-emerald-600 shadow-md">Simpan Data</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let html5QrCode = null;

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const list = window.getListMesin();
      const filtered = list.filter(m => 
        m.namaMesin.toLowerCase().includes(q) || 
        m.noSeri.toLowerCase().includes(q) || 
        m.plant.toLowerCase().includes(q) ||
        (m.tipeMesin && m.tipeMesin.toLowerCase().includes(q))
      );
      window.renderCards(filtered);
    }

    function bukaModal() { document.getElementById('modalForm').classList.remove('hidden'); }
    function tutupModal() { 
      document.getElementById('modalForm').classList.add('hidden'); 
      if (html5QrCode) html5QrCode.stop();
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('ocrContainer').classList.add('hidden');
    }

    function previewFoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.getElementById('imgPreview');
          img.src = evt.target.result;
          img.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    // Membuka menu pemindaian (QR/Barcode atau Scan Teks Foto)
    function bukaOpsiScan() {
      const readerDiv = document.getElementById('reader');
      const ocrDiv = document.getElementById('ocrContainer');
      
      // Toggle tampilkan QR scanner & opsi OCR foto teks
      if (readerDiv.classList.contains('hidden')) {
        readerDiv.classList.remove('hidden');
        ocrDiv.classList.remove('hidden');
        
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (decodedText) => {
            document.getElementById('noSeri').value = decodedText;
            html5QrCode.stop();
            readerDiv.classList.add('hidden');
            ocrDiv.classList.add('hidden');
          }
        ).catch(err => {
          console.log("Kamera QR tidak aktif, gunakan foto teks OCR.");
        });
      } else {
        if (html5QrCode) html5QrCode.stop();
        readerDiv.classList.add('hidden');
        ocrDiv.classList.add('hidden');
      }
    }

    // Fungsi Pembaca Teks/Angka dari Foto (OCR)
    async function prosesScanTeks(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusDiv = document.getElementById('ocrStatus');
      statusDiv.innerText = "Membaca teks dari foto... Mohon tunggu sebentar.";

      try {
        const result = await Tesseract.recognize(file, 'eng', {
          logger: m => console.log(m)
        });
        
        let hasilTeks = result.data.text.trim().replace(/\s+/g, ' ');
        if (hasilTeks) {
          document.getElementById('noSeri').value = hasilTeks;
          statusDiv.innerText = "Berhasil membaca teks!";
          setTimeout(() => {
            document.getElementById('reader').classList.add('hidden');
            document.getElementById('ocrContainer').classList.add('hidden');
            if (html5QrCode) html5QrCode.stop();
          }, 1500);
        } else {
          statusDiv.innerText = "Teks tidak terbaca jelas, coba foto ulang lebih dekat.";
        }
      } catch (err) {
        statusDiv.innerText = "Gagal memproses teks gambar.";
        console.error(err);
      }
    }

    window.bukaModal = bukaModal;
    window.tutupModal = tutupModal;
    window.previewFoto = previewFoto;
    window.bukaOpsiScan = bukaOpsiScan;
    window.prosesScanTeks = prosesScanTeks;
    window.filterData = filterData;
  </script>
</body>
</html>
