<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Mesin Cloud</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- HTML5 QR Code Scanner & Tesseract.js untuk OCR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8W_cABvEnNBtmAFIZPCHE2g9kyxrRi0s",
      authDomain: "mesin-cloud-app.firebaseapp.com",
      projectId: "mesin-cloud-app",
      storageBucket: "mesin-cloud-app.firebasestorage.app",
      messagingSenderId: "20271105778",
      appId: "1:20271105778:web:c253cf35236581a571726b",
      measurementId: "G-TML7FFBP0V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listMesin = [];

    // Kompresi Foto
    function kompresiFoto(file, maxWidth, maxHeight, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round(height *= maxWidth / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round(width *= maxHeight / height);
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    // Format Tanggal
    function formatTanggalDetail(isoString) {
      if(!isoString) return "-";
      const date = new Date(isoString);
      const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][date.getDay()];
      const tgl = date.getDate().toString().padStart(2, '0');
      const bln = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][date.getMonth()];
      const jam = date.getHours().toString().padStart(2, '0');
      const mnt = date.getMinutes().toString().padStart(2, '0');
      return `${hari}, ${tgl} ${bln} - ${jam}:${mnt} WIB`;
    }

    // Muat Data
    async function muatData() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm w-full col-span-full"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat data dari Cloud...</div>`;
      
      try {
        const q = query(collection(db, "mesin"), orderBy("waktuInput", "desc"));
        const querySnapshot = await getDocs(q);
        
        listMesin = [];
        querySnapshot.forEach((d) => {
          listMesin.push({ id: d.id, ...d.data() });
        });
        
        renderKPI(listMesin);
        renderLog(listMesin);
        filterData(); 
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="text-center py-10 text-red-500 text-sm w-full col-span-full">Gagal memuat data dari database. Periksa koneksi internet Anda.</div>`;
      }
    }

    function renderKPI(data) {
      document.getElementById('kpiTotalItem').innerText = data.length;
      const totalUnit = data.reduce((sum, item) => sum + (Number(item.jumlah) || 0), 0);
      document.getElementById('kpiTotalUnit').innerText = totalUnit;
    }

    function renderLog(data) {
      const container = document.getElementById('logContainer');
      const latest3 = data.slice(0, 3);
      
      if(latest3.length === 0) {
         container.innerHTML = `<div class="text-[10px] text-slate-400 mt-2 text-center w-full">Belum ada riwayat input</div>`;
         return;
      }

      container.innerHTML = latest3.map(m => `
        <div class="flex flex-col border-l-2 border-emerald-400 pl-2 mb-1.5 last:mb-0 w-full">
          <span class="text-[10px] font-bold text-slate-700 truncate">${m.namaMesin || 'Tanpa Nama'}</span>
          <span class="text-[9px] text-slate-500">${formatTanggalDetail(m.waktuInput)}</span>
        </div>
      `).join('');
    }

    async function hapusDataMesin(id, nama) {
      if (confirm(`Hapus data mesin "${nama}" secara permanen?`)) {
        try {
          await deleteDoc(doc(db, "mesin", id));
          muatData();
        } catch (err) {
          alert("Gagal menghapus data: " + err.message);
        }
      }
    }

    function renderCards(data) {
      const container = document.getElementById('cardsContainer');
      const currentView = document.getElementById('viewMode').value;

      if (data.length === 0) {
        container.className = "w-full";
        container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm w-full col-span-full">Data tidak ditemukan.</div>`;
        return;
      }

      const getImageHTML = (fotoUrl, kelas) => {
        return (fotoUrl && fotoUrl.length > 50) 
          ? `<img src="${fotoUrl}" class="${kelas}">` 
          : `<div class="${kelas} bg-slate-100 flex items-center justify-center text-slate-400 text-xs"><i class="fa-solid fa-image"></i></div>`;
      };

      if (currentView === 'card') {
        container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4";
        container.innerHTML = data.map(m => `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3 relative group flex flex-col justify-between hover:shadow-md transition duration-200">
            <div class="absolute top-4 right-4 flex gap-1.5 z-10 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition duration-200">
              <button onclick="editDataMesin('${m.id}')" class="bg-blue-500/90 hover:bg-blue-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-[10px] shadow-md transition" title="Edit Data">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="hapusDataMesin('${m.id}', '${m.namaMesin || 'Mesin'}')" class="bg-red-500/90 hover:bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-[10px] shadow-md transition" title="Hapus Data">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
            ${getImageHTML(m.fotoUrl, 'w-full h-48 object-cover rounded-xl border')}
            <div class="flex-1">
              <div class="flex justify-between items-start pr-16">
                <h4 class="font-bold text-slate-800 text-base leading-tight">${m.namaMesin || '-'}</h4>
              </div>
              <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                <span class="bg-blue-50 text-blue-600 border border-blue-100 text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wide">${m.tipeMesin || '-'}</span>
                <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${m.plant || '-'}</p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-[11px] bg-slate-50 p-2.5 rounded-xl text-slate-600 border border-slate-100 mt-auto">
              <div><span class="text-slate-400 block">No Seri:</span> <strong class="truncate block" title="${m.noSeri || ''}">${m.noSeri || '-'}</strong></div>
              <div><span class="text-slate-400 block">Tahun:</span> <strong>${m.tahun || '-'}</strong></div>
              <div><span class="text-slate-400 block">Jumlah:</span> <strong class="text-emerald-600">${m.jumlah || 1} Unit</strong></div>
            </div>
          </div>
        `).join('');
      } else if (currentView === 'details') {
        container.className = "grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-3";
        container.innerHTML = data.map(m => `
          <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex items-center justify-between gap-3 relative hover:shadow-md transition duration-200 group">
            <div class="flex items-center gap-3 overflow-hidden pr-12 w-full">
              ${getImageHTML(m.fotoUrl, 'w-12 h-12 object-cover rounded-lg border flex-shrink-0')}
              <div class="truncate w-full">
                <h4 class="font-bold text-slate-800 text-sm truncate">${m.namaMesin || '-'}</h4>
                <p class="text-[10px] text-slate-500 truncate">${m.plant || '-'} • <span class="text-blue-500 font-semibold">${m.tipeMesin || '-'}</span></p>
              </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md hidden sm:block">${m.jumlah || 1} Unit</span>
              <div class="flex gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition duration-200">
                <button onclick="editDataMesin('${m.id}')" class="text-blue-400 hover:text-blue-600 p-1.5 transition bg-blue-50 rounded-lg" title="Edit Data"><i class="fa-solid fa-pen"></i></button>
                <button onclick="hapusDataMesin('${m.id}', '${m.namaMesin || 'Mesin'}')" class="text-red-400 hover:text-red-600 p-1.5 transition bg-red-50 rounded-lg" title="Hapus Data"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </div>
          </div>
        `).join('');
      } else if (currentView === 'large') {
        container.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4";
        container.innerHTML = data.map(m => `
          <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col justify-between relative group hover:shadow-md transition duration-200">
            <div class="absolute top-4 right-4 flex gap-1 z-10 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition duration-200">
              <button onclick="editDataMesin('${m.id}')" class="bg-blue-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-[9px] shadow-md transition" title="Edit Data"><i class="fa-solid fa-pen"></i></button>
              <button onclick="hapusDataMesin('${m.id}', '${m.namaMesin || 'Mesin'}')" class="bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-[9px] shadow-md transition" title="Hapus Data"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            ${getImageHTML(m.fotoUrl, 'w-full h-28 object-cover rounded-lg border mb-2')}
            <div class="flex flex-col flex-1">
              <h4 class="font-bold text-slate-800 text-xs truncate pr-2">${m.namaMesin || '-'}</h4>
              <p class="text-[9px] text-blue-500 font-bold mb-1 truncate">${m.tipeMesin || '-'}</p>
              <div class="mt-auto pt-1 text-[10px] text-slate-600 bg-slate-50 p-1.5 rounded-lg flex justify-between items-center">
                <span class="truncate pr-1" title="${m.noSeri || ''}">${m.noSeri || '-'}</span>
                <strong class="text-emerald-600 flex-shrink-0">${m.jumlah || 1} U</strong>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    document.getElementById('formMesin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      const editId = document.getElementById('editId').value;
      
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Menyimpan...`;
      btn.disabled = true;

      try {
        let fotoDataFinal = '';
        const fotoFile = document.getElementById('fotoInput').files[0];

        if (fotoFile) {
          fotoDataFinal = await kompresiFoto(fotoFile, 800, 800, 0.7);
        }

        const dataPayload = {
          namaMesin: document.getElementById('namaMesin').value,
          tipeMesin: document.getElementById('tipeMesin').value,
          plant: document.getElementById('plant').value,
          tahun: Number(document.getElementById('tahun').value),
          noSeri: document.getElementById('noSeri').value,
          jumlah: Number(document.getElementById('jumlah').value)
        };

        if (editId) {
          if (fotoDataFinal !== '') dataPayload.fotoUrl = fotoDataFinal;
          await updateDoc(doc(db, "mesin", editId), dataPayload);
        } else {
          dataPayload.fotoUrl = fotoDataFinal;
          dataPayload.waktuInput = new Date().toISOString();
          await addDoc(collection(db, "mesin"), dataPayload);
        }

        btn.innerText = "Simpan Data";
        btn.disabled = false;
        
        tutupModal();
        muatData();
      } catch (err) {
        alert("Terjadi kesalahan: " + err.message);
        btn.innerText = "Simpan Data";
        btn.disabled = false;
      }
    });
  </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center w-full">
      <div>
        <h1 class="font-bold text-lg tracking-wide"><i class="fa-solid fa-industry text-emerald-400 mr-2"></i>Database Mesin</h1>
        <p class="text-xs text-slate-400">Dashboard & Cloud System</p>
      </div>
      <button onclick="bukaModalTambah()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1">
        <i class="fa-solid fa-plus"></i> Tambah
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6 lg:p-8">
    
    <!-- DASHBOARD KPI & LOG -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl p-5 text-white shadow-sm flex flex-col justify-center min-h-[120px]">
        <span class="text-[10px] md:text-xs font-semibold opacity-90 tracking-wide uppercase">Total Aset Keseluruhan</span>
        <div class="flex items-end gap-2 mt-1">
          <span id="kpiTotalItem" class="text-4xl font-bold">0</span>
          <span class="text-[10px] md:text-xs mb-1.5 opacity-80">Mesin Terdata</span>
        </div>
        <div class="text-[10px] md:text-xs bg-black/20 px-3 py-1.5 rounded-lg mt-3 inline-block w-fit font-medium">
          <i class="fa-solid fa-cubes mr-1.5"></i><span id="kpiTotalUnit">0</span> Unit Aktual
        </div>
      </div>
      
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col min-h-[120px]">
        <span class="text-[10px] md:text-xs font-bold text-slate-400 mb-3 uppercase tracking-wide border-b pb-2"><i class="fa-solid fa-clock-rotate-left mr-1.5"></i>Riwayat Terakhir</span>
        <div id="logContainer" class="flex-1 flex flex-col justify-center gap-2"></div>
      </div>
    </div>

    <!-- TOOLBAR PENCARIAN & FILTER -->
    <div class="flex flex-col md:flex-row gap-3 md:gap-4 mb-6 bg-slate-50 border border-slate-200 p-3 md:p-4 rounded-xl shadow-sm items-center">
      <div class="flex gap-2 w-full md:w-auto flex-1 items-center">
        <div class="relative flex-1">
          <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari mesin, tipe, atau plant..." class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm transition">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs md:text-sm"></i>
        </div>
        <button onclick="bukaRekapTipe()" class="bg-blue-50 border border-blue-200 text-blue-600 px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold hover:bg-blue-100 flex items-center justify-center shadow-sm whitespace-nowrap transition">
          <i class="fa-solid fa-chart-pie mr-1.5"></i> Rekap
        </button>
      </div>
      <div class="flex gap-2 w-full md:w-auto items-center justify-between md:justify-end border-t md:border-t-0 md:border-l border-slate-200 pt-3 md:pt-0 md:pl-4 mt-1 md:mt-0">
        <div class="flex items-center gap-2 w-full md:w-auto">
          <span class="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-wide hidden sm:block"><i class="fa-solid fa-arrow-down-a-z mr-1"></i>Sortir:</span>
          <select id="sortBy" onchange="filterData()" class="flex-1 md:w-44 bg-white border border-slate-200 text-xs md:text-sm font-semibold rounded-xl px-3 py-2.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700 cursor-pointer">
            <option value="terbaru">Terbaru Diinput</option>
            <option value="nama_asc">Nama (A-Z)</option>
            <option value="tipe_asc">Tipe (A-Z)</option>
            <option value="tahun_desc">Tahun (Terbaru)</option>
            <option value="tahun_asc">Tahun (Terlama)</option>
            <option value="plant_asc">Lokasi / Plant</option>
          </select>
        </div>
        <select id="viewMode" onchange="filterData()" class="bg-white border border-slate-200 text-xs md:text-sm font-semibold rounded-xl px-3 py-2.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700 cursor-pointer">
          <option value="card">Kartu</option>
          <option value="details">List</option>
          <option value="large">Ikon</option>
        </select>
      </div>
    </div>

    <div id="cardsContainer" class="w-full"></div>
  </main>

  <!-- MODAL FORM INPUT & EDIT -->
  <div id="modalForm" class="fixed inset-0 bg-slate-900/60 z-50 hidden backdrop-blur-sm overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-center justify-center">
      <div class="bg-white rounded-2xl max-w-md w-full p-6 text-left shadow-2xl relative my-8 border-t-4 border-emerald-500">
        <div class="flex justify-between items-center border-b pb-4 mb-4">
          <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Input Mesin Baru</h3>
          <button onclick="tutupModal()" class="text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>

        <form id="formMesin" class="space-y-4 text-sm">
          <input type="hidden" id="editId">

          <div>
            <label class="font-semibold text-slate-700 block mb-1.5">Nama Mesin</label>
            <input type="text" id="namaMesin" required class="w-full p-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition">
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1.5">Tipe Mesin</label>
            <input type="text" id="tipeMesin" required placeholder="Contoh: Press, Puncher, UV Curing..." class="w-full p-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none uppercase transition">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="font-semibold text-slate-700 block mb-1.5">Plant / Lokasi</label>
              <select id="plant" required class="w-full p-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none bg-white cursor-pointer transition">
                <option value="Assembly Plant Alpha">Assembly Plant Alpha</option>
                <option value="Assembly Plant Beta">Assembly Plant Beta</option>
                <option value="Plant 3">Plant 3</option>
              </select>
            </div>
            <div>
              <label class="font-semibold text-slate-700 block mb-1.5">Tahun Mesin</label>
              <input type="number" id="tahun" required class="w-full p-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition" placeholder="2024">
            </div>
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1.5">Nomor Seri</label>
            <div class="flex gap-2">
              <input type="text" id="noSeri" required placeholder="Ketik manual atau scan" class="w-full p-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition">
              <button type="button" onclick="bukaOpsiScan()" class="bg-slate-800 text-white px-4 rounded-xl hover:bg-slate-700 flex items-center justify-center transition">
                <i class="fa-solid fa-camera text-lg"></i>
              </button>
            </div>
            
            <div id="reader" class="hidden mt-2 rounded-xl overflow-hidden border"></div>

            <div id="ocrContainer" class="hidden mt-2 p-3 bg-slate-50 border rounded-xl text-center">
              <p class="text-[11px] text-slate-500 mb-2">Atau ambil foto plat nomor/teks langsung:</p>
              <input type="file" id="ocrInput" accept="image/*" capture="environment" onchange="prosesScanTeks(event)" class="text-[11px] file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
              <div id="ocrStatus" class="text-[11px] text-emerald-600 font-semibold mt-2"></div>
            </div>
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1.5">Jumlah (Unit)</label>
            <input type="number" id="jumlah" value="1" required class="w-full p-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition">
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1.5">Foto Mesin (Opsional)</label>
            <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="previewFoto(event)" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer transition">
            <p class="text-[10px] text-slate-400 mt-1.5 italic">*Biarkan kosong jika tidak ingin mengubah foto lama</p>
            <img id="imgPreview" class="hidden mt-3 w-full h-40 object-cover rounded-xl border">
          </div>

          <div class="pt-4 flex gap-3">
            <button type="button" onclick="tutupModal()" class="w-1/2 py-3 rounded-xl border border-slate-200 font-semibold text-slate-600 hover:bg-slate-50 transition">Batal</button>
            <button type="submit" id="btnSimpan" class="w-1/2 py-3 rounded-xl bg-emerald-500 text-white font-semibold hover:bg-emerald-600 shadow-md transition">Simpan Data</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL REKAP TIPE MESIN -->
  <div id="modalRekap" class="fixed inset-0 bg-slate-900/60 z-50 hidden backdrop-blur-sm overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-center justify-center">
      <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-left shadow-2xl relative border-t-4 border-blue-500 my-8">
        <div class="flex justify-between items-center border-b pb-4 mb-4">
          <h3 class="font-bold text-slate-800 text-base"><i class="fa-solid fa-list-ul text-blue-500 mr-2"></i>Rincian Tipe Mesin</h3>
          <button onclick="tutupRekap()" class="text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <div class="max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
          <ul id="listRekapTipe" class="divide-y divide-slate-100 flex flex-col gap-2"></ul>
        </div>

        <button onclick="tutupRekap()" class="w-full py-3 mt-5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm hover:bg-slate-200 shadow-sm transition">Tutup</button>
      </div>
    </div>
  </div>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>

  <script>
    let html5QrCode = null;

    // FUNGSI UTAMA FILTER & SORTING (Dilindungi dari error data kosong)
    function filterData() {
      const searchInput = document.getElementById('searchInput');
      const sortBySelect = document.getElementById('sortBy');
      const viewModeSelect = document.getElementById('viewMode');

      const q = searchInput ? searchInput.value.toLowerCase() : '';
      const sortBy = sortBySelect ? sortBySelect.value : 'terbaru';
      const viewMode = viewModeSelect ? viewModeSelect.value : 'card';
      
      try {
        localStorage.setItem('preferensiTampilan', viewMode);
        localStorage.setItem('preferensiUrutan', sortBy);
      } catch (e) {
        console.warn("Local storage diblokir.");
      }

      const list = window.getListMesin() || [];
      
      let filtered = list.filter(m => {
        const nama = (m.namaMesin || '').toLowerCase();
        const seri = (m.noSeri || '').toLowerCase();
        const plant = (m.plant || '').toLowerCase();
        const tipe = (m.tipeMesin || '').toLowerCase();
        return nama.includes(q) || seri.includes(q) || plant.includes(q) || tipe.includes(q);
      });

      filtered.sort((a, b) => {
        if (sortBy === 'nama_asc') {
          return (a.namaMesin || '').localeCompare(b.namaMesin || '');
        } else if (sortBy === 'tipe_asc') {
          return (a.tipeMesin || '').localeCompare(b.tipeMesin || '');
        } else if (sortBy === 'tahun_desc') {
          return (Number(b.tahun) || 0) - (Number(a.tahun) || 0);
        } else if (sortBy === 'tahun_asc') {
          return (Number(a.tahun) || 0) - (Number(b.tahun) || 0);
        } else if (sortBy === 'plant_asc') {
          return (a.plant || '').localeCompare(b.plant || '');
        } else {
          return new Date(b.waktuInput || 0).getTime() - new Date(a.waktuInput || 0).getTime();
        }
      });

      window.renderCards(filtered);
    }

    // Inisialisasi Preferensi Tersimpan
    document.addEventListener("DOMContentLoaded", () => {
      try {
        const savedView = localStorage.getItem('preferensiTampilan');
        if (savedView && document.getElementById('viewMode')) {
          document.getElementById('viewMode').value = savedView;
        }

        const savedSort = localStorage.getItem('preferensiUrutan');
        if (savedSort && document.getElementById('sortBy')) {
          document.getElementById('sortBy').value = savedSort;
        }
      } catch (e) {
        console.warn("Gagal memuat preferensi tersimpan.");
      }
    });

    function bukaModalTambah() { 
      document.getElementById('formMesin').reset();
      document.getElementById('editId').value = "";
      document.getElementById('modalTitle').innerText = "Input Mesin Baru";
      document.getElementById('imgPreview').classList.add('hidden');
      document.getElementById('imgPreview').src = "";
      document.getElementById('modalForm').classList.remove('hidden'); 
    }

    function editDataMesin(id) {
      const data = window.getListMesin().find(m => m.id === id);
      if (!data) return;

      document.getElementById('editId').value = data.id;
      document.getElementById('namaMesin').value = data.namaMesin || "";
      document.getElementById('tipeMesin').value = data.tipeMesin || "";
      document.getElementById('plant').value = data.plant || "";
      document.getElementById('tahun').value = data.tahun || "";
      document.getElementById('noSeri').value = data.noSeri || "";
      document.getElementById('jumlah').value = data.jumlah || 1;

      const imgP = document.getElementById('imgPreview');
      if (data.fotoUrl && data.fotoUrl.length > 50) {
        imgP.src = data.fotoUrl;
        imgP.classList.remove('hidden');
      } else {
        imgP.src = "";
        imgP.classList.add('hidden');
      }

      document.getElementById('modalTitle').innerText = "Edit Data Mesin";
      document.getElementById('modalForm').classList.remove('hidden');
    }

    function tutupModal() { 
      document.getElementById('modalForm').classList.add('hidden'); 
      if (html5QrCode) html5QrCode.stop();
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('ocrContainer').classList.add('hidden');
    }

    function bukaRekapTipe() {
      const rekap = {};
      const list = window.getListMesin();
      
      list.forEach(m => {
        const tipe = m.tipeMesin ? m.tipeMesin.trim().toUpperCase() : 'LAIN-LAIN';
        if (!rekap[tipe]) {
          rekap[tipe] = { totalUnit: 0, mesins: [] };
        }
        rekap[tipe].totalUnit += (Number(m.jumlah) || 1);
        rekap[tipe].mesins.push(m);
      });

      const container = document.getElementById('listRekapTipe');
      let html = '';
      
      if (Object.keys(rekap).length === 0) {
        html = '<li class="py-6 text-center text-sm text-slate-400">Data mesin masih kosong.</li>';
      } else {
        const sortedKeys = Object.keys(rekap).sort();
        sortedKeys.forEach(tipe => {
          html += `
            <li class="pt-2 pb-4 border-b border-slate-100 last:border-0">
              <div class="flex justify-between items-center mb-2.5">
                <span class="font-bold text-slate-700 text-sm">${tipe}</span>
                <span class="bg-blue-50 border border-blue-100 text-blue-600 px-2.5 py-1 rounded text-xs font-bold">${rekap[tipe].totalUnit} Unit</span>
              </div>
              <div class="flex flex-col gap-2 pl-2.5 border-l-2 border-slate-200 ml-1">
          `;
          
          rekap[tipe].mesins.forEach(mesin => {
            html += `
                <div class="bg-slate-50 p-2.5 rounded-lg text-xs leading-relaxed border border-slate-100 hover:border-slate-300 transition">
                  <div class="font-bold text-slate-800">${mesin.namaMesin || '-'}</div>
                  <div class="text-slate-500 flex items-center justify-between mt-1">
                    <span class="truncate pr-2"><i class="fa-solid fa-location-dot text-slate-400 mr-1.5"></i>${mesin.plant || '-'}</span>
                    <span class="bg-slate-200 px-2 py-0.5 rounded font-medium text-slate-600">Thn: ${mesin.tahun || '-'}</span>
                  </div>
                </div>
            `;
          });

          html += `</div></li>`;
        });
      }
      
      container.innerHTML = html;
      document.getElementById('modalRekap').classList.remove('hidden');
    }

    function tutupRekap() {
      document.getElementById('modalRekap').classList.add('hidden');
    }

    function previewFoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.getElementById('imgPreview');
          img.src = evt.target.result;
          img.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function bukaOpsiScan() {
      const readerDiv = document.getElementById('reader');
      const ocrDiv = document.getElementById('ocrContainer');
      
      if (readerDiv.classList.contains('hidden')) {
        readerDiv.classList.remove('hidden');
        ocrDiv.classList.remove('hidden');
        
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (decodedText) => {
            document.getElementById('noSeri').value = decodedText;
            html5QrCode.stop();
            readerDiv.classList.add('hidden');
            ocrDiv.classList.add('hidden');
          }
        ).catch(err => {
          console.log("Kamera QR tidak aktif, gunakan foto teks OCR.");
        });
      } else {
        if (html5QrCode) html5QrCode.stop();
        readerDiv.classList.add('hidden');
        ocrDiv.classList.add('hidden');
      }
    }

    async function prosesScanTeks(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusDiv = document.getElementById('ocrStatus');
      statusDiv.innerText = "Membaca teks dari foto... Mohon tunggu.";

      try {
        const result = await Tesseract.recognize(file, 'eng');
        let hasilTeks = result.data.text.trim().replace(/\s+/g, ' ');
        if (hasilTeks) {
          document.getElementById('noSeri').value = hasilTeks;
          statusDiv.innerText = "Berhasil membaca teks!";
          setTimeout(() => {
            document.getElementById('reader').classList.add('hidden');
            document.getElementById('ocrContainer').classList.add('hidden');
            if (html5QrCode) html5QrCode.stop();
          }, 1500);
        } else {
          statusDiv.innerText = "Teks tidak terbaca jelas.";
        }
      } catch (err) {
        statusDiv.innerText = "Gagal memproses gambar.";
        console.error(err);
      }
    }

    window.bukaModalTambah = bukaModalTambah;
    window.editDataMesin = editDataMesin;
    window.tutupModal = tutupModal;
    window.bukaRekapTipe = bukaRekapTipe;
    window.tutupRekap = tutupRekap;
    window.previewFoto = previewFoto;
    window.bukaOpsiScan = bukaOpsiScan;
    window.prosesScanTeks = prosesScanTeks;
    window.filterData = filterData;
    
    window.muatData = muatData;
    window.renderCards = renderCards;
    window.hapusDataMesin = hapusDataMesin;
    window.getListMesin = () => listMesin;
    
    muatData();
  </script>
</body>
</html>
